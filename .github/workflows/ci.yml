name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r skills/audit-workflow/scripts/requirements.txt

      - name: Consistency check
        run: python tools/check_consistency.py --check-profile-boilerplate

      - name: Unit tests
        run: python -m unittest discover -s tests -v
